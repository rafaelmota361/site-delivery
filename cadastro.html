<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro - Trattoria Venezia</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="auth.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="auth-body">

    <div class="auth-card">
        <div class="auth-header">
            <a href="index.html">
                <img src="logo-delivery.png" alt="Trattoria Venezia" class="auth-logo">
            </a>
            <h2>Crie sua conta</h2>
            <p>Acompanhe seus pedidos e salve seus endereços</p>
        </div>

        <div id="authAlert" class="auth-alert hidden"></div>

        <form id="cadastroForm" class="auth-form">
            <div class="form-row">
                <div class="form-group">
                    <label for="nome">Nome *</label>
                    <input type="text" id="nome" required placeholder="Ex: Rafael">
                </div>
                <div class="form-group">
                    <label for="sobrenome">Sobrenome *</label>
                    <input type="text" id="sobrenome" required placeholder="Ex: Mota">
                </div>
            </div>

            <div class="form-group">
                <label for="email">E-mail *</label>
                <input type="email" id="email" required placeholder="seuemail@exemplo.com">
            </div>

            <div class="form-row">
                <div class="form-group">
                    <label for="cpf">CPF *</label>
                    <input type="text" id="cpf" required placeholder="000.000.000-00" maxlength="14">
                </div>
                <div class="form-group">
                    <label for="telefone">Telefone *</label>
                    <input type="tel" id="telefone" required placeholder="(31) 90000-0000" maxlength="15">
                </div>
            </div>

            <div class="form-group">
                <label for="senha">Senha *</label>
                <input type="password" id="senha" required placeholder="Digite sua senha">
            </div>

            <button type="submit" class="btn-auth-submit">Cadastrar</button>
        </form>

        <div class="auth-footer">
            <p>Já possui uma conta? <a href="login.html" class="auth-link-blue">Entrar</a></p>
        </div>
    </div>

    <script src="auth.js"></script>
</body>
</html>
