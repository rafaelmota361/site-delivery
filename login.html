<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Trattoria Venezia</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="auth.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="auth-body">

    <div class="auth-card">
        <div class="auth-header">
            <a href="index.html">
                <img src="logo-delivery.png" alt="Trattoria Venezia" class="auth-logo">
            </a>
            <h2>Acesse sua conta</h2>
            <p>Informe seus dados para continuar</p>
        </div>

        <div id="authAlert" class="auth-alert hidden"></div>

        <form id="loginForm" class="auth-form">
            <div class="form-group">
                <label for="loginEmail">E-mail</label>
                <input type="email" id="loginEmail" required placeholder="seuemail@exemplo.com">
            </div>

            <div class="form-group">
                <label for="loginSenha">Senha</label>
                <input type="password" id="loginSenha" required placeholder="Digite sua senha">
            </div>

            <button type="submit" class="btn-auth-submit">Entrar</button>
        </form>

        <div class="auth-footer">
            <p>Não possui uma conta? <a href="cadastro.html" class="auth-link-blue">Cadastre-se</a></p>
        </div>
    </div>

    <script src="auth.js"></script>
</body>
</html>
